name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run Flake8
        run: uv run flake8 .

      - name: Run mypy
        run: uv run mypy

      - name: Run tests
        run: uv run pytest
