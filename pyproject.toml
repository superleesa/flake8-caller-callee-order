[project]
name = "flake8-caller-callee-order"
version = "0.1.1"
description = "Flake8 plugin that checks local definition/reference order"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.0.0",
]

[dependency-groups]
dev = [
    "flake8-pyproject>=1.2.4",
    "mypy>=1.18.0",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["flake8_caller_callee_order"]

[project.entry-points."flake8.extension"]
CCO = "flake8_caller_callee_order:CallerCalleeOrderChecker"

[tool.ruff]
target-version = "py312"

[tool.flake8]
select = ["CCO"]
exclude = [
    ".git",
    ".venv",
    "dist",
    "tests/fixtures",
]
caller-callee-order = "callee-before-caller"

[tool.mypy]
python_version = "3.12"
files = ["flake8_caller_callee_order.py", "tests"]
